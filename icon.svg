<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pwa-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#pwa-bg-grad)"/>
  <g filter="url(#shadow)">
    <!-- Checklist Background Card -->
    <rect x="110" y="100" width="292" height="312" rx="36" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Checkmarks & Lines -->
    <circle cx="165" cy="180" r="20" fill="#10B981"/>
    <path d="M157 180 L163 186 L175 174" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="205" y="172" width="160" height="16" rx="8" fill="#4B5563"/>

    <circle cx="165" cy="256" r="20" fill="#3B82F6"/>
    <path d="M157 256 L163 262 L175 250" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="205" y="248" width="130" height="16" rx="8" fill="#4B5563"/>

    <!-- Pomodoro Floating Accent -->
    <circle cx="340" cy="335" r="52" fill="url(#pwa-accent-grad)"/>
    <circle cx="340" cy="335" r="42" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M340 310 L340 335 L356 345" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
