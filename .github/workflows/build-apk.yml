name: 📱 Build TreTH Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🤖 Đóng gói Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn dự án (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Cài đặt Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Cài đặt thư viện Node (npm)
        run: |
          npm ci || npm install

      - name: 🔄 Đồng bộ tài nguyên Web vào www/
        run: |
          node sync-assets.js

      - name: 🤖 Đồng bộ Capacitor sang thư mục Android
        run: |
          npx cap sync android

      - name: 🔑 Cấp quyền thực thi cho Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: 🏗️ Biên dịch APK với Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Chuẩn bị file APK cài đặt
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-v4.3.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-v4.2.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-v3.1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-latest.apk
          echo "Danh sách file APK đã tạo:"
          ls -lh dist-apk/

      - name: 📤 Lưu trữ APK vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TreTH-Android-APK
          path: dist-apk/*.apk
          retention-days: 90

      - name: 🚀 Tạo GitHub Release v4.3.0 & Đính kèm file APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v4.3.0
          name: "TreTH v4.3.0 - Bản cài đặt Android (APK) Fix Triệt Để Bàn Phím Ảo & Gõ Tiếng Việt"
          body: |
            ## 📱 TreTH v4.3.0 - Ứng dụng Quản lý công việc, Pomodoro, Thói quen & Ghi chú

            Chào bạn! File cài đặt APK chính thức của **TreTH v4.3.0** (đã khắc phục triệt để lỗi bàn phím ảo giữ ký tự trong bộ đệm IME khi gõ Tiếng Việt Telex/VNI và lỗi chạm mở bàn phím trên các ô nhập liệu con) đã được tự động đóng gói sẵn sàng để tải về.

            ### 📥 Tải về trực tiếp (Tải trong mục Assets bên dưới):
            - 📲 **`TreTH-v4.3.0.apk`**: Bản cài đặt mới nhất (v4.3.0) tối ưu cho mọi điện thoại Android.
            - 🚀 **`TreTH-latest.apk`**: Bản cài đặt mới nhất.

            ---

            ### 🛠️ Hướng dẫn cài đặt trên Android:
            1. Mở trang này trên trình duyệt điện thoại Android hoặc tải về máy tính rồi chép sang điện thoại.
            2. Nhấp vào file **`TreTH-v4.3.0.apk`** ở mục **Assets** bên dưới để tải về máy.
            3. Nhấp mở file APK vừa tải -> Chọn **Cài đặt / Cập nhật**.
            4. Khởi chạy ứng dụng **TreTH** từ màn hình chính!
          files: dist-apk/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
