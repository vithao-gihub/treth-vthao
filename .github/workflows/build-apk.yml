name: 📱 Build TreTH Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🤖 Đóng gói Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn dự án (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Cài đặt Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Cài đặt thư viện Node (npm)
        run: |
          npm ci || npm install

      - name: 🔄 Đồng bộ tài nguyên Web vào www/
        run: |
          node sync-assets.js

      - name: 🤖 Đồng bộ Capacitor sang thư mục Android
        run: |
          npx cap sync android

      - name: 🔑 Cấp quyền thực thi cho Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: 🏗️ Biên dịch APK với Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Chuẩn bị file APK cài đặt
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-v3.1.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/TreTH-latest.apk
          echo "Danh sách file APK đã tạo:"
          ls -lh dist-apk/

      - name: 📤 Lưu trữ APK vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TreTH-Android-APK
          path: dist-apk/*.apk
          retention-days: 90

      - name: 🚀 Tạo GitHub Release & Đính kèm file APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: "TreTH v3.1.${{ github.run_number }} - Bản cài đặt Android (APK)"
          body: |
            ## 📱 TreTH - Ứng dụng Quản lý công việc, Pomodoro, Thói quen & Ghi chú

            Chào bạn! File cài đặt APK chính thức của **TreTH** đã được tự động đóng gói sẵn sàng để tải về và sử dụng lâu dài trên điện thoại Android.

            ### 📥 Tải về trực tiếp (Tải trong mục Assets bên dưới):
            - 🚀 **`TreTH-latest.apk`**: Bản cài đặt mới nhất tự động cập nhật.
            - 📲 **`TreTH-v3.1.${{ github.run_number }}.apk`**: Bản cài đặt ổn định của phiên bản này.

            ---

            ### 🛠️ Hướng dẫn cài đặt trên Android:
            1. Mở trang này trên trình duyệt điện thoại Android hoặc tải về máy tính rồi chép sang điện thoại.
            2. Nhấp vào file **`TreTH-latest.apk`** ở mục **Assets** bên dưới để tải về máy.
            3. Nhấp mở file APK vừa tải -> Chọn **Cài đặt**.
               *(Nếu điện thoại hiển thị cảnh báo "Cho phép cài đặt từ nguồn này", bạn hãy bật công tắc Cho phép để tiếp tục)*.
            4. Khởi chạy ứng dụng **TreTH** từ màn hình chính và bắt đầu quản lý công việc!

            ---

            ### ✨ Cải tiến kiến trúc Modular & Cloud Sync Abstraction:
            - **Kiến trúc Modular hóa:** Tách bạch rõ ràng giữa Data Layer (`LocalRepository`, `SyncQueue`, `CloudSyncService`) và các Feature Modules (`tasks`, `habits`, `notes`, `pomodoro`, `calendar`, `stats`, `settings`).
            - **Single Source of Truth:** `LocalRepository.js` quản lý thống nhất 100% CSDL.
            - **Sẵn sàng cho Cloud Sync:** Tích hợp `CloudSyncService` trừu tượng hóa kết nối đồng bộ đám mây và giải quyết xung đột đa thiết bị.
            - **100% Hoạt động Offline:** Dữ liệu luôn an toàn trên máy, không phụ thuộc kết nối mạng.
          files: dist-apk/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

